name: Scrape West Virginia Cash Pop

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Connectivity test
        run: |
          echo "Runner IP: $(curl -s https://api.ipify.org)"
          for u in kentucky west-virginia; do
            echo "--- $u"
            curl -s -o /dev/null -w "code=%{http_code} connect=%{time_connect}s\n" --connect-timeout 8 "https://www.lottery.net/$u/cash-pop/numbers" || echo "FAILED"
          done

      - name: Run fetch script
        env:
          LOTTERY_URL   : ${{ secrets.WESTVIRGINIA_URL }}
          WEBAPP_URL    : ${{ secrets.WESTVIRGINIA_WEBAPP_URL }}
          SHARED_SECRET : ${{ secrets.WESTVIRGINIA_SECRET }}
        run: python scripts/fetch.py
